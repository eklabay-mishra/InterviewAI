{% extends "base.html" %}

{% block public_content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5 col-lg-4">
        <div class="glass-card p-4 p-md-5">
            <div class="text-center mb-4">
                <h3 class="text-white font-weight-bold">Reset Password</h3>
                <p class="text-muted small">Enter your email to receive password reset instructions.</p>
            </div>

            <form action="{{ url_for('auth.forgot_password') }}" method="POST">
                <div class="mb-4">
                    <label class="form-label text-muted small font-weight-bold">Registered Email</label>
                    <input type="email" name="email" class="form-control glass-input" placeholder="name@company.com" required>
                </div>

                <button type="submit" class="btn btn-primary-glow w-100 py-3">
                    Send Reset Link <i class="bi bi-send-fill ms-1"></i>
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="{{ url_for('auth.login') }}" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
