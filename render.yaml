services:
  - type: web
    name: interview-ai
    env: python
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.2
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
